{% extends 'orders/base.html' %}{% block title %}Rules & settings{% endblock %}{% block body %}<div class="row"><div class="col-lg-6"><div class="card"><div class="card-body"><h6>Business rules</h6><form method="post">{% csrf_token %}<div class="mb-2"><label class="form-label">Flag unconfirmed orders after (hours)</label><input name="unconfirmed_hours" type="number" step="any" min="0.1" value="{{ cfg.unconfirmed_hours }}" class="form-control"></div><div class="mb-2"><label class="form-label">Flag confirmed orders not dispatched after (hours)</label><input name="dispatch_hours" type="number" step="any" min="0.1" value="{{ cfg.dispatch_hours }}" class="form-control"></div><div class="mb-2"><label class="form-label">High-value threshold (₹)</label><input name="high_value" type="number" step="any" min="1" value="{{ cfg.high_value }}" class="form-control"></div><div class="mb-3"><label class="form-label">Simulated current time (leave blank for live clock)</label><input name="as_of" type="datetime-local" value="{{ cfg_as_of_input }}" class="form-control"></div><button class="btn btn-primary" {% if not is_manager %}disabled{% endif %}>Save and re-run rules</button>{% if not is_manager %}<span class="small-muted ms-2">Switch to the manager to edit rules.</span>{% endif %}</form></div></div></div><div class="col-lg-4"><div class="card border-danger"><div class="card-body"><h6>Reset</h6><p class="small-muted">Deletes all orders, tasks, audit records and settings.</p><form method="post" action="{% url 'reset' %}" onsubmit="return confirm('Delete all data?')">{% csrf_token %}<button class="btn btn-outline-danger btn-sm">Clear all data</button></form></div></div></div></div>{% endblock %}
