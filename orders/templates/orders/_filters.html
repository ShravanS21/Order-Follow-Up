<form method="get" class="row g-2 align-items-end mb-3"><div class="col-6 col-md-2"><label class="form-label small mb-0">Order date from</label><input type="date" name="from" value="{{ f.from }}" class="form-control form-control-sm"></div><div class="col-6 col-md-2"><label class="form-label small mb-0">Order date to</label><input type="date" name="to" value="{{ f.to }}" class="form-control form-control-sm"></div><div class="col-6 col-md-2"><label class="form-label small mb-0">Exception type</label><select name="rule" class="form-select form-select-sm"><option value="">All</option>{% for k,v in RULES.items %}<option value="{{ k }}" {% if f.rule == k %}selected{% endif %}>{{ v }}</option>{% endfor %}</select></div><div class="col-6 col-md-2"><label class="form-label small mb-0">Employee</label><select name="employee" class="form-select form-select-sm"><option value="">All</option>{% for u in users %}<option {% if f.employee == u %}selected{% endif %}>{{ u }}</option>{% endfor %}<option {% if f.employee == 'Unassigned' %}selected{% endif %}>Unassigned</option></select></div><div class="col-6 col-md-1"><label class="form-label small mb-0">Priority</label><select name="priority" class="form-select form-select-sm"><option value="">All</option>{% for p in PRIORITIES %}<option {% if f.priority == p %}selected{% endif %}>{{ p }}</option>{% endfor %}</select></div>{% if show_status %}<div class="col-6 col-md-1"><label class="form-label small mb-0">Status</label><select name="status" class="form-select form-select-sm"><option value="">All</option>{% for s in TASK_STATUSES %}<option {% if f.status == s %}selected{% endif %}>{{ s }}</option>{% endfor %}</select></div>{% endif %}<div class="col-auto"><button class="btn btn-sm btn-primary">Apply filters</button><a href="{{ request.path }}" class="btn btn-sm btn-outline-secondary">Clear</a></div></form>
